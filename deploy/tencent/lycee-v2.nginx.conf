server {
    listen 80;
    server_name v2.preview.lycee-toolbox.top www.lycee-toolbox.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name v2.preview.lycee-toolbox.top www.lycee-toolbox.top;
    ssl_certificate /etc/letsencrypt/live/lycee-toolbox.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lycee-toolbox.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    # Dedicated www-data-owned 0700 directory; do not inherit the old proxy cache permissions.
    proxy_temp_path /var/lib/nginx/lycee-v2-proxy 1 2;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ "^/api/cards/(LO-[0-9]{4}[A-Za-z0-9-]{0,16})/thumbnail$" {
        root /var/lib/lycee/images;
        try_files /thumb/$1.webp /original/$1.png @lycee_v2;
        types { image/webp webp; image/png png; }
        default_type image/png;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/api/cards/(LO-[0-9]{4}[A-Za-z0-9-]{0,16})/image$" {
        alias /var/lib/lycee/images/original/$1.png;
        types { }
        default_type image/png;
        error_page 404 = @lycee_v2;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files /__lycee_v2_no_static_file__ @lycee_v2;
    }

    location @lycee_v2 {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
